name: Update RSS Feeds

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v.7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v.7.0.0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v.10.0.1

      - name: Generate Hugging Face daily papers feed
        run: python generate_feed.py

      - name: Generate LangChain releases feed
        run: python generate_langchain_feed.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hf-daily-papers/feed.xml langchain-releases/feed.xml
          if git diff --cached --quiet; then
            echo "No feed changes"
          else
            git commit -m "chore: update feed $(date -u +%Y-%m-%d)"
            git push
          fi